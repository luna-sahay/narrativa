<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dogs en Marte - Intro</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark;--bg:#000;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family: 'Kalam', cursive;}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh * 1376 / 768));aspect-ratio:1376/768;overflow:hidden;background:#000}
#a{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;will-change:transform;display:block}
#b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;opacity:0;display:block}
#blk{position:absolute;inset:0;background:#000;pointer-events:none}

/* Texto abajo a la derecha que sale al inicio */
#texto-intro {
    position: absolute;
    bottom: 10px;
    right: 40px;
    color: white;
    font-size: 28px;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 10px;
    transition: opacity 0.5s ease;
    z-index: 5;
}

/* Globo de diálogo para Sam */
#globo-sam {
    position: absolute;
    top: 40%; 
    left: 42%; 
    background: white;
    color: black;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 20px;
    border-radius: 30px;
    max-width: 260px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
    opacity: 0; 
    transition: opacity 0.8s ease;
    z-index: 5;
}

#globo-sam::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 40px;
    border-width: 15px 15px 0;
    border-style: solid;
    border-color: white transparent;
    display: block;
    width: 0;
}

/* Botón estilo flecha narrativa de cómic */
#btn-siguiente {
    position: absolute;
    bottom: 40px;
    right: 40px;
    padding: 10px 25px;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 0px;
    font-family: 'Kalam', cursive;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    clip-path: polygon(0% 20%, 80% 20%, 80% 0%, 100% 50%, 80% 100%, 80% 80%, 0% 80%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background 0.2s, transform 0.2s;
    z-index: 6;
}
#btn-siguiente:hover {
    background: #e64a19;
    transform: scale(1.05);
}
    /* Animación de pulso brillante estilo Genially */
@keyframes brilloGenially {
    0% { box-shadow: 0 0 0 0 rgba(255, 87, 34, 0.7); transform: scale(1); }
    70% { box-shadow: 0 0 0 15px rgba(255, 87, 34, 0); transform: scale(1.02); }
    100% { box-shadow: 0 0 0 0 rgba(255, 87, 34, 0); transform: scale(1); }
}

/* Aplicamos el brillo al globo de Sam y le indicamos que es cliqueable */
#globo-sam.interactivo {
    cursor: pointer;
    animation: brilloGenially 2s infinite;
    border: 2px solid #ff5722; /* Un borde sutil naranja para guiar el clic */
}

/* Tercera escena (Tu nueva imagen a pantalla completa) */
#c {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    display: block;
    pointer-events: none;
    transition: opacity 1.2s ease-in-out; /* Transición suave tipo Genially */
    z-index: 10;
}

</style></head><body>
<div id="stage">
  <!-- REEMPLAZA ESTA LÍNEA 69 CON TU IMAGEN EN BASE64 COMPLETA -->
  <img id="a" src="Escena1-Escenario1.jpg">
  <img id="b" src="Escena2-Escenario2.jpg">
    <img id="c" src="samAvaricioso">

  <div id="texto-intro" style="opacity: 0;">¿Me está hablando...?</div>
  
  <!-- Añadimos 'onclick' para que reaccione al tocarlo -->
  <div id="globo-sam" onclick="cambiarAEscenaTres()">¡Con todos los cohetes que van a llegar, este lugar se va a llenar de clientes!</div>

  <div id="blk"></div>
</div>

<div id="texto-intro" style="opacity: 0;">Shhh, Sam está hablando…</div>
  <div id="globo-sam">¡Con todos los cohetes que van a llegar, este lugar se va a llenar de clientes!</div>
  <button id="btn-siguiente" onclick="irASiguienteEscena()">Continuar...</button>

  <div id="blk"></div>
</div>

<script>
var stage=document.getElementById("stage"),A=document.getElementById("a"),B=document.getElementById("b"),blk=document.getElementById("blk");
var FLY=15,XF0=13.4,XF=1.8,END=FLY+0.5,t0=null,run=false;

function ease(p){return 0.5-0.5*Math.cos(Math.PI*Math.min(1,Math.max(0,p)))}
function sm(u){u=Math.min(1,Math.max(0,u));return u*u*(3-2*u)}

function frame(t){
  var W=stage.clientWidth,H=stage.clientHeight;
  var p=ease(t/FLY),s=Math.exp(Math.log(1.8)*p);
  var cx=50+0.5*p-Math.sin(p*Math.PI)*3+Math.sin(t*0.8)*0.25*(1-p);
  var cy=40+22*p+Math.sin(t*0.6)*0.2*(1-p);
  var tx=W/2-cx/100*W*s,ty=H/2-cy/100*H*s;
  tx=Math.min(0,Math.max(W-W*s,tx));ty=Math.min(0,Math.max(H-H*s,ty));
  A.style.transform="translate("+tx+"px,"+ty+"px) scale("+s+")";
  B.style.opacity=sm((t-XF0)/XF);
  blk.style.opacity=Math.max(0,1-t/1.6);
}

function tick(now){
  if(!run)return;
  if(t0===null)t0=now;
  var t=(now-t0)/1000;

  // NUEVO: Control de tiempo para el texto de introducción
  var txtIntro = document.getElementById('texto-intro');
  if (t >= 11.5 && t < 13.4) {
    txtIntro.style.opacity = '1'; // Aparece justo antes del cambio de foto
  } else if (t >= 13.4) {
    txtIntro.style.opacity = '0'; // Se desvanece cuando entra la nueva foto
  }

  if(t>=END){
    frame(END);
    run=false;
    finalizarAnimacionZoom(); 
    return;
  }
  frame(t);
  requestAnimationFrame(tick);
}

function start(){t0=null;run=true;requestAnimationFrame(tick)}

addEventListener("keydown",function(e){if(e.key==="r"||e.key==="R"){run=false;setTimeout(start,30)}});
addEventListener("resize",function(){if(!run)frame(END)});

// AL TERMINAR EL ZOOM SE ACTIVA ESTO:
function finalizarAnimacionZoom() {
    document.getElementById('texto-intro').style.opacity = '0';
    
    setTimeout(() => {
        const globo = document.getElementById('globo-sam');
        globo.style.opacity = '1';
        // Le agregamos la clase interactiva para que empiece a brillar al terminar el zoom
        globo.classList.add('interactivo'); 
    }, 500);
}

// Esta función se ejecuta mágicamente cuando el usuario "espicha" el globo de texto
function cambiarAEscenaTres() {
    // Escondemos el globo de texto de inmediato
    const globo = document.getElementById('globo-sam');
    globo.style.opacity = '0';
    globo.style.pointerEvents = 'none';
    
    // Hacemos aparecer la tercera imagen en toda la pantalla con un fundido suave
    const escena3 = document.getElementById('c');
    escena3.style.opacity = '1';
    escena3.style.pointerEvents = 'auto';
}

frame(0);
window.addEventListener("load",function(){setTimeout(start,400)});
</script>
</body></html>
