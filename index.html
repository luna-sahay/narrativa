<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dogs en Marte - Intro</title>
<!-- Importamos la fuente Kalam estilo cómic desde Google Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark;--bg:#000;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family: 'Kalam', cursive;}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh * 1376 / 768));aspect-ratio:1376/768;overflow:hidden;background:#000}
#a{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;will-change:transform;display:block}
#b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;opacity:0;display:block}
#blk{position:absolute;inset:0;background:#000;pointer-events:none}

/* 1. Texto abajo a la derecha durante el zoom */
#texto-intro {
    position: absolute;
    bottom: 40px;
    right: 40px;
    color: white;
    font-size: 28px;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 10px;
    transition: opacity 0.5s ease;
    z-index: 5;
}

/* 2. Globo de diálogo estilo cómic para Sam */
#globo-sam {
    position: absolute;
    top: 25%; /* Ajusta este porcentaje para moverlo arriba/abajo sobre su cabeza */
    left: 45%; /* Ajusta este porcentaje para moverlo a la izquierda/derecha */
    background: white;
    color: black;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 20px;
    border-radius: 30px;
    max-width: 250px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
    opacity: 0; /* Oculto al principio */
    transition: opacity 0.8s ease;
    z-index: 5;
}

/* El piquito del globo de diálogo */
#globo-sam::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 30px;
    border-width: 15px 15px 0;
    border-style: solid;
    border-color: white transparent;
    display: block;
    width: 0;
}

/* 3. Botón para pasar a la siguiente escena */
#btn-siguiente {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 30px;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Kalam', cursive;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background 0.2s;
    z-index: 6;
}
#btn-siguiente:hover {
    background: #e64a19;
}
</style></head><body>
<div id="stage">
  <!-- AQUÍ PEGA TU LÍNEA 14 ORIGINAL (La que empieza con data:image...) -->
  <img id="a" src="Escena1-Escenario1.jpg">
  
  <!-- Segunda escena (pon el nombre de la imagen que vas a subir a GitHub) -->
  <img id="b" src="Escena2-Escenario2.jpg">

  <!-- Elementos nuevos que me pediste -->
  <div id="texto-intro">¿Me está hablando...?</div>
  <div id="globo-sam">¡Con todos los juguetes que van a llegar a este lugar, se va a llenar de clientes!</div>
  <button id="btn-siguiente" onclick="irASiguienteEscena()">Siguiente Escena</button>

  <div id="blk"></div>
</div>

<script>
// ... (Aquí van las funciones matemáticas de tu código original que ya tenías abajo) ...
// Busca la función 'tick' o donde termina la animación en tu código original.
// Al finalizar la animación, agregaremos este código automáticamente:

function finalizarAnimacionZoom() {
    // Ocultamos el texto de abajo a la derecha
    document.getElementById('texto-intro').style.opacity = '0';
    
    // Mostramos el globo de texto de Sam en la cabeza
    setTimeout(() => {
        document.getElementById('globo-sam').style.opacity = '1';
    }, 500);

    // Mostramos el botón para cambiar de escena un poquito después
    setTimeout(() => {
        const btn = document.getElementById('btn-siguiente');
        btn.style.opacity = '1';
        btn.pointerEvents = 'auto';
    }, 2000);
}

function irASiguienteEscena() {
    // Hace aparecer la escena 2 desvaneciendo la anterior
    document.getElementById('globo-sam').style.opacity = '0';
    document.getElementById('btn-siguiente').style.opacity = '0';
    
    const escena2 = document.getElementById('b');
    escena2.style.transition = "opacity 1.5s ease-in-out";
    escena2.style.opacity = "1";
}

// NOTA: Para activar 'finalizarAnimacionZoom()', solo debes llamarla 
// justo debajo de la línea que ya tenías: "if(t>=END){frame(END);run=false; return;}"
// Debería quedar así: if(t>=END){frame(END);run=false; finalizarAnimacionZoom(); return;}
</script>
</body></html>
