<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Dogs en Marte — Historia completa</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #story { display:block; width:100%; height:100%; border:0; background:#000; }
  #transition { position:fixed; inset:0; z-index:10; background:#000; opacity:0; pointer-events:none; transition:opacity 1.2s ease; }
  #transition.active { opacity:1; }
</style>
</head>
<body>
<iframe id="story" title="Historia de Sam y Elma" src="elma.html" allow="autoplay"></iframe>
<div id="transition" aria-hidden="true"></div>
<script>
  const frame = document.getElementById('story');
  const transition = document.getElementById('transition');
  let advanced = false;
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || !event.data || event.data.type !== 'sam-elma-finished' || advanced) return;
    advanced = true;
    // Mantiene el negro final unos instantes y luego muestra la intro del marciano.
    transition.classList.add('active');

setTimeout(() => {
  frame.title = 'Historia de Sam y el marciano';
  frame.src = 'marciano.html';

  frame.onload = () => {
    setTimeout(() => transition.classList.remove('active'), 250);
  };
}, 2200);
  });
</script>
</body>
</html>
