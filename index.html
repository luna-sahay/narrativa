<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Dogs en Marte - Intro</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{color-scheme:dark;--bg:#000;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family: 'Kalam', cursive;}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh * 1376 / 768));aspect-ratio:1376/768;overflow:hidden;background:#000}
#a{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;will-change:transform;display:block}
#b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;opacity:0;display:block}
#blk{position:absolute;inset:0;background:#000;pointer-events:none}

/* Texto abajo a la derecha */
#texto-intro {
    position: absolute;
    bottom: 40px;
    right: 40px;
    color: white;
    font-size: 28px;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-radius: 10px;
    transition: opacity 0.5s ease;
    z-index: 5;
}

/* Globo de diálogo para Sam */
#globo-sam {
    position: absolute;
    top: 25%; 
    left: 45%; 
    background: white;
    color: black;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 20px;
    border-radius: 30px;
    max-width: 250px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
    opacity: 0; 
    transition: opacity 0.8s ease;
    z-index: 5;
}

#globo-sam::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 30px;
    border-width: 15px 15px 0;
    border-style: solid;
    border-color: white transparent;
    display: block;
    width: 0;
}

/* Botón Siguiente */
#btn-siguiente {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 30px;
    background: #ff5722;
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Kalam', cursive;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, background 0.2s;
    z-index: 6;
}
#btn-siguiente:hover {
    background: #e64a19;
}
</style></head><body>
<div id="stage">
  <img id="a" src="Escena1-Escenario1.jpg">
  <img id="b" src="Escena2-Escenario2.jpg">

  <div id="texto-intro">¿Me está hablando...?</div>
  <div id="globo-sam">¡Con todos los juguetes que van a llegar a este lugar, se va a llenar de clientes!</div>
  <button id="btn-siguiente" onclick="irASiguienteEscena()">Siguiente Escena</button>

  <div id="blk"></div>
</div>

<script>
// AQUÍ VOLVEMOS A ARMAR EL MOTOR ORIGINAL COMPLETO QUE ME MOSTRASTE
var t0=null, run=true;
var W=1376, H=768;
var END=5.5; // Tiempo de duración de la animación en segundos

function frame(t) {
    var A = document.getElementById("a");
    var B = document.getElementById("b");
    var blk = document.getElementById("blk");
    
    // Fórmulas matemáticas de tu animación de cámara original
    var p = Math.max(0, Math.min(1, t / END));
    var s = Math.exp(Math.log(1.0) * p); 
    var cx = 50 + 0.5 * p + Math.sin(p * Math.PI) * 3 + Math.sin(t * 0.8) * 0.25 * (1 - p);
    var cy = 40 + 22 * p + Math.sin(t * 0.6) * 0.2 * (1 - p);
    var tx = W / 2 - cx / 100 * W * s, ty = H / 2 - cy / 100 * H * s;
    
    tx = Math.min(0, Math.max(W - W * s, tx));
    ty = Math.min(0, Math.max(H - H * s, ty));
    
    A.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
    B.style.opacity = "0";
    blk.style.opacity = Math.max(0, 1 - t / 1.6);
}

function tick(now) {
    if (!run) return;
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    
    if (t >= END) {
        frame(END);
        run = false;
        finalizarAnimacionZoom(); // ACTIVAMOS TUS TEXTOS AL TERMINAR EL ZOOM
        return;
    }
    frame(t);
    requestAnimationFrame(tick);
}

// NUEVAS FUNCIONES PARA TUS TEXTOS E INTERACTIVIDAD
function finalizarAnimacionZoom() {
    // Escondemos el texto de abajo a la derecha de forma suave
    document.getElementById('texto-intro').style.opacity = '0';
    
    // Hacemos aparecer el globo de diálogo de Sam en su cabeza
    setTimeout(() => {
        document.getElementById('globo-sam').style.opacity = '1';
    }, 500);

    // Hacemos aparecer el botón "Siguiente" un poco después
    setTimeout(() => {
        const btn = document.getElementById('btn-siguiente');
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
    }, 2000);
}

function irASiguienteEscena() {
    document.getElementById('globo-sam').style.opacity = '0';
    document.getElementById('btn-siguiente').style.opacity = '0';
    
    // Transición suave hacia la siguiente imagen de GitHub
    const escena2 = document.getElementById('b');
    escena2.style.transition = "opacity 1.5s ease-in-out";
    escena2.style.opacity = "1";
}

// Arranca el código de forma automática al cargar la web
requestAnimationFrame(tick);
</script>
</body></html>
